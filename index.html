<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Anniversary ❤️</title>
<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  color: white;
  text-align: center;
}
.container {
  padding: 40px 20px;
}
h1 {
  font-size: 2.5em;
}
p {
  font-size: 1.2em;
  max-width: 500px;
  margin: auto;
}
.counter {
  font-size: 1.5em;
  margin-top: 20px;
}
.heart {
  font-size: 2em;
  animation: pulse 1s infinite;
}
@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}
</style>
</head>

<body>
<div class="container">
  <h1>Happy Anniversary ❤️</h1>
  <p>
    Even though miles separate us,  
    my heart chooses you every single day.  
    Thank you for being my constant. 💕
  </p>

  <div class="counter" id="counter"></div>
  <div class="heart">💖</div>
</div>

<script>
const startDate = new Date("2023-02-14"); // CHANGE THIS DATE
const today = new Date();
const diffTime = Math.abs(today - startDate);
const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

document.getElementById("counter").innerHTML =
  `We’ve been together for <b>${diffDays}</b> days 🥰`;
</script>

</body>
</html>
